<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini OLX</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Mini OLX</h1>
    </header>

    <section id="search-section">
        <input type="text" id="search-bar" placeholder="Search for items...">
        <button id="search-button">Search</button>
    </section>

    <section id="add-listing-section">
        <h2>Add New Listing</h2>
        <form id="add-listing-form">
            <div>
                <label for="listing-title">Title:</label>
                <input type="text" id="listing-title" required>
            </div>
            <div>
                <label for="listing-description">Description:</label>
                <textarea id="listing-description" required></textarea>
            </div>
            <div>
                <label for="listing-price">Price:</label>
                <input type="number" id="listing-price" required>
            </div>
            <button type="submit">Add Listing</button>
        </form>
    </section>

    <main id="listings-section">
        <h2>Listings</h2>
        <div id="listings-container">
            <!-- Listings will be dynamically added here -->
        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
